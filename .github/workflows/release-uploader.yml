name: Prepare PlenBotLogUploader release

on:
  push:
    tags:
      - 'Release-*'
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Clean NuGet cache
      run: dotnet nuget locals all --clear
    - name: Build
      run: dotnet build PlenBotLogUploader.csproj -c Release
    - name: Package PlenBotLogUploader (Windows, net8)
      run: dotnet publish PlenBotLogUploader.csproj -c Release -r win-x64 --self-contained=false -p:PublishSingleFile=true -o artifacts/uploader/win64/
    - name: Package PlenBotLogUploader (Windows, self-contained)
      run: dotnet publish PlenBotLogUploader.csproj -c Release -r win-x64 --self-contained=true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true -o artifacts/uploader/win64-sc/
    - name: Package PlenBotLogUploader (Windows, all dlls)
      run: dotnet publish PlenBotLogUploader.csproj -c Release -r win-x64 --self-contained=false -p:PublishSingleFile=false -o artifacts/uploader/win64-dlls/
    - name: Prettify executable filenames & zip
      run: |
        powershell Compress-Archive artifacts/uploader/win64-dlls/* artifacts/PlenBotLogUploader-win-x64-dlls.zip
        cp artifacts/uploader/win64/PlenBotLogUploader.exe artifacts/PlenBotLogUploader-win-x64-framework.exe
        cp artifacts/uploader/win64-sc/PlenBotLogUploader.exe artifacts/PlenBotLogUploader-win-x64.exe
    - name: Upload Windows Release Assets
      uses: actions/upload-artifact@v4
      with:
        name: windows-release-assets
        path: |
          artifacts/PlenBotLogUploader-win-x64.exe
          artifacts/PlenBotLogUploader-win-x64-framework.exe
          artifacts/PlenBotLogUploader-win-x64-dlls.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Install packaging tools
      run: |
        sudo apt-get update
        sudo apt-get install -y icoutils file libfuse2
    - name: Clean NuGet cache
      run: dotnet nuget locals all --clear
    - name: Build
      run: dotnet build PlenBotLogUploader.csproj -c Release
    - name: Publish PlenBotLogUploader (Linux, self-contained)
      run: dotnet publish PlenBotLogUploader.csproj -c Release -r linux-x64 --self-contained=true -p:PublishSingleFile=true -o artifacts/publish/linux-x64/
    - name: Build Linux AppImage
      run: |
        bash packaging/linux/build-appimage.sh artifacts/publish/linux-x64 artifacts/appimage
    - name: Package Linux tar.gz
      run: |
        tar -czvf artifacts/PlenBotLogUploader-linux-x64.tar.gz -C artifacts/publish/linux-x64 .
    - name: Stage Linux Release Assets
      run: |
        mkdir -p artifacts/linux-assets
        cp artifacts/appimage/PlenBotLogUploader-x86_64.AppImage artifacts/linux-assets/
        cp artifacts/PlenBotLogUploader-linux-x64.tar.gz artifacts/linux-assets/
    - name: Upload Linux Release Assets
      uses: actions/upload-artifact@v4
      with:
        name: linux-release-assets
        path: artifacts/linux-assets/*

  publish-release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Download Windows Assets
      uses: actions/download-artifact@v4
      with:
        name: windows-release-assets
        path: release-files

    - name: Download Linux Assets
      uses: actions/download-artifact@v4
      with:
        name: linux-release-assets
        path: release-files

    - name: Prepare release
      uses: softprops/action-gh-release@v2
      with:
        name: PlenBot Log Uploader ${{ github.ref_name }} (Cross-Platform)
        draft: false
        body_path: RELEASE_NOTES.md
        files: release-files/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
