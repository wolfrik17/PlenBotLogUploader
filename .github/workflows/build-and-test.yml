name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Clean NuGet cache
      run: dotnet nuget locals all --clear
    - name: Build
      run: dotnet build PlenBotLogUploader.csproj -c Release
    - name: Package PlenBotLogUploader (Windows, net8)
      run: dotnet publish PlenBotLogUploader.csproj -c Release -r win-x64 --self-contained=false -p:PublishSingleFile=true -o artifacts/uploader/win64/
    - name: Package PlenBotLogUploader (Windows, self-contained)
      run: dotnet publish PlenBotLogUploader.csproj -c Release -r win-x64 --self-contained=true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true -o artifacts/uploader/win64-sc/
    - name: Package PlenBotLogUploader (Windows, all dlls)
      run: dotnet publish PlenBotLogUploader.csproj -c Release -r win-x64 --self-contained=false -p:PublishSingleFile=false -o artifacts/uploader/win64-dlls/
    - name: Bundle PDBs
      run: |
        mkdir -p artifacts/pdb/uploader/win64/
        mv artifacts/uploader/win64/*.pdb artifacts/pdb/uploader/win64/
    - name: Upload PlenBotLogUploader (Windows, net8)
      uses: actions/upload-artifact@v4
      with:
        name: PlenBotLogUploader (Windows, net8)
        path: artifacts/uploader/win64/PlenBotLogUploader.exe
    - name: Upload PlenBotLogUploader (Windows, self-contained)
      uses: actions/upload-artifact@v4
      with:
        name: PlenBotLogUploader (Windows, self-contained)
        path: artifacts/uploader/win64-sc/PlenBotLogUploader.exe
    - name: Upload PlenBotLogUploader (Windows, all dlls)
      uses: actions/upload-artifact@v4
      with:
        name: PlenBotLogUploader (Windows, all dlls)
        path: artifacts/uploader/win64-dlls/
    - name: Upload PDB files
      uses: actions/upload-artifact@v4
      with:
        name: PDB files (Windows)
        path: artifacts/pdb/

  build-linux:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Install packaging tools
      run: |
        sudo apt-get update
        sudo apt-get install -y icoutils file libfuse2
    - name: Clean NuGet cache
      run: dotnet nuget locals all --clear
    - name: Build
      run: dotnet build PlenBotLogUploader.csproj -c Release
    - name: Publish PlenBotLogUploader (Linux, self-contained)
      run: dotnet publish PlenBotLogUploader.csproj -c Release -r linux-x64 --self-contained=true -p:PublishSingleFile=true -o artifacts/publish/linux-x64/
    - name: Build Linux AppImage
      run: |
        bash packaging/linux/build-appimage.sh artifacts/publish/linux-x64 artifacts/appimage
    - name: Package Linux tar.gz
      run: |
        tar -czvf artifacts/PlenBotLogUploader-linux-x64.tar.gz -C artifacts/publish/linux-x64 .
    - name: Upload PlenBotLogUploader AppImage
      uses: actions/upload-artifact@v4
      with:
        name: PlenBotLogUploader (Linux, AppImage)
        path: artifacts/appimage/PlenBotLogUploader-x86_64.AppImage
    - name: Upload PlenBotLogUploader (Linux, tar.gz)
      uses: actions/upload-artifact@v4
      with:
        name: PlenBotLogUploader (Linux, tar.gz)
        path: artifacts/PlenBotLogUploader-linux-x64.tar.gz
    - name: Upload PlenBotLogUploader (Linux, standalone binary)
      uses: actions/upload-artifact@v4
      with:
        name: PlenBotLogUploader (Linux, binary)
        path: artifacts/publish/linux-x64/PlenBotLogUploader
